server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      multipart:
        enabled: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - PreserveHostHeader

        - id: receipt-service
          uri: lb://receipt-service
          predicates:
            - Path=/receipt/**
          filters:
            - PreserveHostHeader

      default-filters:
        - RemoveRequestHeader=Cookie

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      httpclient:
        max-initial-line-length: 50000

  codec:
    max-in-memory-size: 10MB

  discovery:
    locator:
      enabled: true
      lower-case-service-id: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.security: DEBUG
    com.budgetmate.user.security: DEBUG
    org.springframework.web: DEBUG
